# Isolated settings for Node live checks and CI. Does not replace config.toml.
[server]
instance_id = "01950000-0000-7000-8000-000000000001"
name = "CI"
listen = "127.0.0.1:18080"
public_url = "http://127.0.0.1:18080"
allowed_origins = ["http://127.0.0.1:18080"]

[auth]
token_secret = "local-development-only-change-me-32b"
access_ttl_seconds = 900
refresh_ttl_days = 30

[database]
url = "postgres://chat:chat_dev@localhost:5432/chat"
max_connections = 8

[redis]
url = "redis://localhost:6379"

[storage]
provider = "s3"
endpoint = "http://localhost:9000"
public_url = "http://localhost:9000/chat"
bucket = "chat"
access_key = "chat_dev"
secret_key = "local-development-only"
local_dir = "data/objects"

[rtc]
provider = "livekit"
public_url = "http://localhost:7880"
api_key = "devkey"
api_secret = "local-development-only-change-me-32"

[logging]
filter = "error"
