[package]
name = "chat-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chat-domain = { path = "../domain" }
chat-protocol = { path = "../protocol" }
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
config = { version = "0.15", default-features = false, features = ["toml"] }
url = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout", "cors"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
