[package]
name = "chat-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chat-domain = { path = "../domain" }
chat-protocol = { path = "../protocol" }
axum = { version = "0.8", features = ["ws"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
config = { version = "0.15", default-features = false, features = ["toml"] }
url = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout", "cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
