# Single-node host process for machines without Docker.
# Compose still uses deploy/livekit.yaml (redis:6379). Keys must match config.toml [rtc].
port: 7880
# 0.0.0.0 lets LAN browsers and other devices reach LiveKit. Loopback-only blocks /voice pages off-box.
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
keys:
  devkey: local-development-only-change-me-32
