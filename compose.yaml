name: chat

x-api: &api
  image: chat-api:local
  build:
    context: .
    dockerfile: deploy/Dockerfile
  environment: &api-env
    CHAT__SERVER__LISTEN: 0.0.0.0:8080
    CHAT__SERVER__PUBLIC_URL: http://localhost:8080
    CHAT__SERVER__ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    CHAT__DATABASE__URL: postgres://chat:chat_dev@postgres:5432/chat
    CHAT__REDIS__URL: redis://redis:6379
    CHAT__STORAGE__PROVIDER: local
    CHAT__STORAGE__LOCAL_DIR: /app/data/objects
    CHAT__STORAGE__PUBLIC_URL: http://localhost:8080/api/v1
    CHAT__RTC__PUBLIC_URL: http://localhost:7880
  volumes:
    - ./config.toml:/app/config.toml:ro
    - api-data:/app/data
  logging: &logs
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  api:
    <<: *api
    ports:
      - "${CHAT_PUBLISH:-127.0.0.1}:8080:8080"
    depends_on:
      migrate: {condition: service_completed_successfully}
      prepare-data: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["migrate"]
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  prepare-data:
    image: busybox:1.37
    command: ["sh", "-c", "mkdir -p /data/objects && chown -R 65532:65532 /data"]
    volumes:
      - api-data:/data
    restart: "no"
    logging: *logs

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat_dev
      POSTGRES_DB: chat
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logs

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logs

  # Optional. Community images left Docker Hub; API still writes the local volume.
  # Start with: docker compose --profile s3 up -d
  minio:
    profiles: ["s3"]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: chat_dev
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "${CHAT_PUBLISH:-127.0.0.1}:9000:9000"
      - "${CHAT_PUBLISH:-127.0.0.1}:9001:9001"
    volumes: ["minio:/data"]
    restart: unless-stopped
    logging: *logs

  livekit:
    image: livekit/livekit-server:v1.9.0
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./deploy/livekit.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "${CHAT_PUBLISH:-127.0.0.1}:7880:7880"
      - "${CHAT_PUBLISH:-127.0.0.1}:7881:7881"
      - "${CHAT_PUBLISH:-127.0.0.1}:50000-50100:50000-50100/udp"
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    logging: *logs

volumes:
  postgres:
  api-data:
  minio:
