name: chat
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      CHAT__SERVER__LISTEN: 0.0.0.0:8080
      CHAT__DATABASE__URL: postgres://chat:chat_dev@postgres:5432/chat
      CHAT__REDIS__URL: redis://redis:6379
      CHAT__STORAGE__ENDPOINT: http://minio:9000
    volumes:
      - ./config.toml:/app/config.toml:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: &logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["migrate"]
    environment:
      CHAT__DATABASE__URL: postgres://chat:chat_dev@postgres:5432/chat
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    logging: *logs
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat_dev
      POSTGRES_DB: chat
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logs
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    logging: *logs
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: chat_dev
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["objects:/data"]
    restart: unless-stopped
    logging: *logs
  livekit:
    image: livekit/livekit-server:v1.9.0
    command: ["--config", "/etc/livekit.yaml"]
    volumes: ["./deploy/livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["127.0.0.1:7880:7880", "127.0.0.1:7881:7881", "127.0.0.1:50000-50100:50000-50100/udp"]
    depends_on: [redis]
    restart: unless-stopped
    logging: *logs
volumes:
  postgres:
  objects:
