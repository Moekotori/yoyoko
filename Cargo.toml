[workspace]
resolver = "3"
members = ["src/server/domain", "src/server/protocol", "src/server/app", "src/media-worker"]
default-members = ["src/server/domain", "src/server/protocol", "src/server/app"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.1.0"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "fs", "io-util", "sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
